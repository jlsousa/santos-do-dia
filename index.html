<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182e39">
<meta name="description" content="Santos do Dia: calendário católico, biografias e história da santidade.">
<title>Santos do Dia</title>
<style>
:root{font-family:Georgia,serif;color:#20333a;background:#f7f5ef}*{box-sizing:border-box}body{margin:0}header{background:#18323e;color:#fff;padding:32px 18px;text-align:center}header h1{font-size:clamp(2.2rem,6vw,4rem);margin:0 0 8px}header p{margin:0;color:#e7d6ad}.wrap{max-width:940px;margin:auto;padding:26px 18px}nav{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 0 28px}button,input{font:inherit;padding:10px;border:1px solid #c4c9c7;border-radius:8px;background:white;color:#18323e}button{cursor:pointer}button:hover{background:#efe8d8}.panel{background:#fff;border:1px solid #e2e0d9;border-radius:14px;padding:clamp(20px,4vw,38px);box-shadow:0 5px 20px #00000009}.eyebrow{font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:#7c6b47}h2{font-size:clamp(1.6rem,4vw,2.5rem);margin:10px 0}p{line-height:1.65}.notice{background:#f8f1dd;border-left:4px solid #b69450;padding:12px 16px;margin:22px 0}.entry{border-top:1px solid #e5e3dd;padding-top:22px;margin-top:22px}.entry h3{font-size:1.5rem;margin-bottom:8px}.saint-image{width:min(100%,290px);max-height:370px;object-fit:contain;float:right;margin:0 0 18px 22px;border-radius:10px}.image-credit{font-size:.78rem;clear:both}.saint-figure{float:right;width:min(100%,290px);margin:0 0 18px 22px;text-align:center}.saint-figure .saint-image{float:none;margin:0;width:100%;min-height:190px;background:#f0ede5}.saint-figure figcaption{font:12px/1.4 system-ui,sans-serif;color:#657177;padding:5px}.saint-figure a{overflow-wrap:anywhere}.entry:after{content:'';display:block;clear:both}@media(max-width:580px){.saint-figure{float:none;display:block;margin:12px auto;max-width:290px}.saint-image{max-height:330px}}small,footer{font-family:system-ui,sans-serif;color:#657177}a{color:#275a73}footer{text-align:center;padding:28px 16px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#status{min-height:1.5em}
@media print{header{padding:12px;color:#20333a;background:white}nav,.actions,footer{display:none!important}.panel{box-shadow:none;border:0;padding:0}.saint-figure{break-inside:avoid}.entry{break-inside:avoid}a{color:#20333a}}
</style>
</head>
<body>
<header><div class="eyebrow" style="color:#d6c494">Calendário católico</div><h1>Santos do Dia</h1><p>Histórias de fé, memória e testemunho</p></header>
<main class="wrap">
<nav aria-label="Navegação por datas"><button id="prev" type="button">← Dia anterior</button><input type="date" id="date" aria-label="Escolher data"><button id="today" type="button">Hoje</button><button id="next" type="button">Dia seguinte →</button></nav>
<article class="panel"><div class="eyebrow">Santos e beatos</div><h2 id="heading"></h2><p id="status" role="status"></p><section id="content"></section></article>
<div class="actions" style="margin-top:20px"><button id="share" type="button">Partilhar esta data</button><button id="print" type="button">Imprimir / guardar PDF</button></div>
</main><footer>Projeto Santos do Dia · Conteúdos sujeitos a verificação histórica e litúrgica</footer>
<script>

// Apenas imagens individualmente identificadas e com origem documental são publicadas.
function imagePlaceholder(name){const initial='✝';const svg='<svg xmlns="http://www.w3.org/2000/svg" width="290" height="240" viewBox="0 0 290 240"><rect width="290" height="240" fill="#e8e0ce"/><circle cx="145" cy="90" r="60" fill="none" stroke="#b79b62" stroke-width="3"/><text x="145" y="111" text-anchor="middle" font-size="57" font-family="Georgia" fill="#77643e">'+initial+'</text><text x="145" y="199" text-anchor="middle" font-size="13" fill="#665f50" font-family="Georgia">Iconografia em pesquisa</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
async function loadSaintImage(saint,img,caption){
  const placeholder=imagePlaceholder(saint.nome);
  img.src=placeholder;
  caption.textContent='Iconografia pendente de validação editorial.';
  const item=saint.imagem;
  if(!item||item.verificada!==true||!item.url||!item.fonte){if(item?.fonte){caption.replaceChildren();caption.append(document.createTextNode('Imagem candidata ainda não publicada. '));const a=document.createElement('a');a.href=item.fonte;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Consultar fonte';caption.append(a)}return;}
  img.alt=item.descricao||('Representação de '+saint.nome);
  img.src=item.url;
  caption.replaceChildren();
  caption.append(document.createTextNode((item.descricao||'Representação iconográfica verificada')+' · '));
  const link=document.createElement('a');link.href=item.fonte;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Fonte e licença';caption.append(link);if(item.licenca){caption.append(document.createTextNode(' · '+item.licenca))}
  img.onerror=()=>{img.onerror=null;img.src=placeholder;caption.replaceChildren();caption.append(document.createTextNode('Não foi possível carregar a imagem. '));const a=document.createElement('a');a.href=item.fonte;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Consultar imagem na origem';caption.append(a)};
}

const dateInput=document.getElementById('date'),heading=document.getElementById('heading'),content=document.getElementById('content'),status=document.getElementById('status');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>[d.getFullYear(),pad(d.getMonth()+1),pad(d.getDate())].join('-');
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayPortugal=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return o.year+'-'+o.month+'-'+o.day};
const fmt=d=>new Intl.DateTimeFormat('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number.isNaN(parse(s).getTime()))return;dateInput.value=s;history.replaceState(null,'','?data='+s);render(s)}
async function render(s){heading.textContent=fmt(parse(s));content.replaceChildren();status.textContent='A consultar o arquivo…';
try{const response=await fetch('data/'+s+'.json',{cache:'no-store'});if(!response.ok)throw Error('Ainda não existe uma ficha publicada para esta data.');const doc=await response.json();if(dateInput.value!==s)return;status.textContent=doc.liturgia||'';if(doc.introducao){const intro=document.createElement('p');intro.className='notice';intro.textContent=doc.introducao;content.append(intro)}if(doc.estado){const state=document.createElement('p');state.className='notice';state.textContent=doc.estado;content.append(state)}for(const saint of doc.santos||[]){const block=document.createElement('section');block.className='entry';const h=document.createElement('h3');h.textContent=saint.nome;block.append(h);{const holder=document.createElement('figure');holder.className='saint-figure';const img=document.createElement('img');img.className='saint-image';img.alt='Representação iconográfica de '+saint.nome;img.loading='lazy';img.referrerPolicy='no-referrer';const caption=document.createElement('figcaption');caption.className='image-credit';holder.append(img,caption);block.append(holder);loadSaintImage(saint,img,caption)}for(const field of ['identificacao','biografia','patronato','milagres','sepultura','ensinamento']){if(saint[field]){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=({identificacao:'Identificação',biografia:'Biografia',patronato:'Patronato',milagres:'Milagres atribuídos',sepultura:'Sepultura e relíquias',ensinamento:'Ensinamento espiritual'})[field]+': ';p.append(b,document.createTextNode(saint[field]));block.append(p)}}if(saint.beatificacao||saint.canonizacao||saint.referencias_biblicas){for(const [k,label] of [['beatificacao','Beatificação'],['canonizacao','Canonização'],['referencias_biblicas','Referências bíblicas']]){if(saint[k]){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(saint[k]));block.append(p)}}}if(Array.isArray(saint.fontes)){const p=document.createElement('p');p.append(document.createTextNode('Fontes: '));saint.fontes.forEach((u,i)=>{if(i)p.append(' · ');const a=document.createElement('a');a.href=u;a.rel='noopener noreferrer';a.target='_blank';a.textContent='Fonte '+(i+1);p.append(a)});block.append(p)}content.append(block)}if(doc.beatos?.length){const b=document.createElement('section');b.className='entry';const h=document.createElement('h3');h.textContent='Beatos';b.append(h);for(const beato of doc.beatos){const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=beato.nome+'. ';p.append(strong,document.createTextNode(beato.identificacao||''));b.append(p)}content.append(b)}if(doc.reflexao){const sec=document.createElement('section');sec.className='entry';const h=document.createElement('h3');h.textContent='Reflexão do dia';const p=document.createElement('p');p.textContent=doc.reflexao;sec.append(h,p);content.append(sec)}if(doc.fontes?.length){const sec=document.createElement('section');sec.className='entry';const h=document.createElement('h3');h.textContent='Fontes principais';sec.append(h);doc.fontes.forEach((url,i)=>{const p=document.createElement('p');const a=document.createElement('a');a.href=url;a.rel='noopener noreferrer';a.target='_blank';a.textContent='Fonte '+(i+1);p.append(a);sec.append(p)});content.append(sec)}if(!content.children.length)status.textContent='Ainda não há conteúdo publicado para esta data.'}
catch(e){if(dateInput.value!==s)return;status.textContent=e.message;const p=document.createElement('p');p.className='notice';p.textContent='O arquivo está em preparação. Não apresentamos biografias ou milagres sem verificação das fontes.';content.append(p)}}
document.getElementById('prev').onclick=()=>{const d=parse(dateInput.value);d.setDate(d.getDate()-1);setDate(iso(d))};document.getElementById('next').onclick=()=>{const d=parse(dateInput.value);d.setDate(d.getDate()+1);setDate(iso(d))};document.getElementById('today').onclick=()=>setDate(todayPortugal());dateInput.onchange=()=>setDate(dateInput.value);document.getElementById('print').onclick=()=>window.print();document.getElementById('share').onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({title:'Santos do Dia',url});return}catch(e){}}if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Link copiado.')}else prompt('Copiar ligação:',url)};
const q=new URLSearchParams(location.search).get('data');setDate(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)?q:todayPortugal());
</script></body></html>
